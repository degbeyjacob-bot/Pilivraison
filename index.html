<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PiLivraison - Abomey-Calavi</title>
<style>
body{font-family:Arial;margin:0;background:#FFF7ED}
header{background:#FF6B00;color:white;padding:20px;text-align:center}
h1{margin:0;font-size:28px}
.card{background:white;margin:15px;padding:20px;border-radius:15px;box-shadow:0 2px 10px #ddd}
button{background:#FF6B00;color:white;border:none;padding:15px;width:100%;border-radius:10px;font-size:18px;font-weight:bold}
input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px}
</style>
</head>
<body>
<header>
<h1>🛵 PiLivraison</h1>
<p>Livraison rapide à Abomey-Calavi</p>
<p>⭐ Payement en Pi</p>
</header>
<div class="card">
<h2>Commander une livraison</h2>
<input placeholder="D'où ? Ex: Godomey">
<input placeholder="Vers où ? Ex: Calavi centre">
<select><option>Moto - 500 FCFA</option><option>Voiture - 1500 FCFA</option></select>
<input placeholder="Ton numéro WhatsApp">
<button onclick="alert('Commande envoyée ! On te contacte sur WhatsApp')">COMMANDER MAINTENANT</button>
</div>
<div class="card">
<h3>🍔 Restaurants partenaires</h3>
<p>🥘 Maquis Chez Maman - Godomey</p>
<p>🍕 Pizza Calavi - Arconville</p>
<p>🍗 Poulet Bicyclette - Ouèdo</p>
</div>
</body>
</html>
